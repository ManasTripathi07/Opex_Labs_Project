services:
  # Backend API
  - type: web
    name: production-tracker-api
    env: node
    region: oregon
    buildCommand: cd backend && npm install && npm run migrate
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: production-tracker-db
          property: connectionString
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: production-tracker-db
    databaseName: production_tracker
