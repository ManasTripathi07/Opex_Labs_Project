  <!-- Smoke -->
  <circle cx="46" cy="8" r="3" fill="#94a3b8" opacity="0.6"/>
  <circle cx="50" cy="6" r="3.5" fill="#94a3b8" opacity="0.5"/>
  <circle cx="54" cy="8" r="3" fill="#94a3b8" opacity="0.4"/>

