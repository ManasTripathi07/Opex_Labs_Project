  <rect x="32" y="39" width="6" height="6" fill="#dbeafe" rx="0.5"/>

  <rect x="14" y="48" width="6" height="6" fill="#dbeafe" rx="0.5"/>
  <rect x="23" y="48" width="6" height="6" fill="#dbeafe" rx="0.5"/>
  <rect x="32" y="48" width="6" height="6" fill="#dbeafe" rx="0.5"/>

